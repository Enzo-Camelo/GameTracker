name: Funcionalidade
description: Proponha uma nova funcionalidade ou melhoria
title: 'feat: '
labels: ['funcionalidade']
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual necessidade do usuário isto atende?
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceitação
      placeholder: |
        - [ ] O jogador consegue...
        - [ ] O app impede...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [dashboard, lista de jogos, detalhes do jogo, estatísticas, o que jogar, navegação/widgets, pipeline/infra]
    validations:
      required: true
