name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Restaurar dependências
        run: flutter pub get

      - name: Análise estática (lint)
        run: flutter analyze

      - name: Testes unitários e de widget
        run: flutter test

      - name: Build de verificação (debug)
        run: flutter build apk --debug